# ------------------------------------------------
# Configuration
# ------------------------------------------------

env=WLR_RENDERER,vulkan

# Autostart
exec-once=swaybg -i ~/Pictures/Wallpapers/nixos-mocha.png -m fill
exec-once=wlsunset -t 3000 -T 6500 -s 20:00 -S 07:00
exec-once=swayidle -w
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once=quickshell --daemonize --no-duplicate
exec-once=chatgpt
exec-once=chromium
exec-once=appflowy

# Monitors
monitorrule=name:^eDP-1$,width:2880,height:1800,refresh:120,x:2048,y:0,scale:1.5
monitorrule=name:^DP-2$,width:2560,height:1440,refresh:144,x:0,y:0,scale:1.25

# Inputs Devices
xkb_rules_layout=us,us
xkb_rules_variant=,intl
xkb_rules_options=ctrl:nocaps

mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0

tap_to_click=1
trackpad_disable_while_typing=1
trackpad_natural_scrolling=1
trackpad_accel_profile=1
trackpad_accel_speed=1.0

# Misc
no_border_when_single=1
idleinhibit_ignore_visible=1

# ------------------------------------------------
# Visuals
# ------------------------------------------------

# Theming
borderpx=2
gappih=0
gappiv=0
gappoh=0
gappov=0
cursor_size=24
cursor_theme=Bibata-Modern-Amber

#Colors
rootcolor=0x1e1e2eff
bordercolor=0x6c7086ff
focuscolor=0xfab387ff
urgentcolor=0xf38ba8ff
scratchpadcolor=0xb4befeff

# Effects
blur=0
shadows=0

# Animations
animations=0

# ------------------------------------------------
# Window Management
# ------------------------------------------------

# Layouts
new_is_master=0
default_mfact=0.50

# Rules
windowrule=tags:1,monitor:eDP-1,isopensilent:1,appid:(?i).*chromium.*
windowrule=tags:2,monitor:eDP-1,appid:(?i).*virt-manager.*
windowrule=tags:2,monitor:eDP-1,appid:(?i).*qemu.*
windowrule=tags:3,monitor:eDP-1,appid:(?i).*wezterm.*
windowrule=tags:4,monitor:eDP-1,isopensilent:1,appid:(?i).*appflowy.*
windowrule=tags:5,monitor:eDP-1,appid:(?i).*freetube.*

windowrule=isfloating:1,width:0.75,height:0.75,appid:^tui$
windowrule=isfloating:1,width:0.6,height:0.6,title:(?i).*localsend.*

windowrule=isnamedscratchpad:1,width:0.8,height:0.8,appid:^foot-scratchpad$
windowrule=isnamedscratchpad:1,isopensilent:1,width:0.95,height:0.95,appid:(?i).*chatgpt.*

# Tags
tagrule=id:*,layout_name:master

tagrule=id:1,monitor_name:eDP-1
tagrule=id:2,monitor_name:eDP-1
tagrule=id:3,monitor_name:eDP-1
tagrule=id:4,monitor_name:eDP-1
tagrule=id:5,monitor_name:eDP-1

tagrule=id:6,monitor_name:DP-2
tagrule=id:7,monitor_name:DP-2
tagrule=id:8,monitor_name:DP-2
tagrule=id:9,monitor_name:DP-2
tagrule=id:10,monitor_name:DP-2

# ------------------------------------------------
# Bindings & Input
# ------------------------------------------------

# Tags
bind=SUPER,code:9,toggleoverview,1
bind=SUPER,code:10,viewcrossmon,1,eDP-1
bind=SUPER,code:11,viewcrossmon,2,eDP-1
bind=SUPER,code:12,viewcrossmon,3,eDP-1
bind=SUPER,code:13,viewcrossmon,4,eDP-1
bind=SUPER,code:14,viewcrossmon,5,eDP-1
bind=SUPER,code:15,viewcrossmon,6,DP-2
bind=SUPER,code:16,viewcrossmon,7,DP-2
bind=SUPER,code:17,viewcrossmon,8,DP-2
bind=SUPER,code:18,viewcrossmon,9,DP-2

# Move the focused window to a tag
bind=SUPER+SHIFT,code:10,tagcrossmon,1,eDP-1
bind=SUPER+SHIFT,code:11,tagcrossmon,2,eDP-1
bind=SUPER+SHIFT,code:12,tagcrossmon,3,eDP-1
bind=SUPER+SHIFT,code:13,tagcrossmon,4,eDP-1
bind=SUPER+SHIFT,code:14,tagcrossmon,5,eDP-1
bind=SUPER+SHIFT,code:15,tagcrossmon,6,DP-2
bind=SUPER+SHIFT,code:16,tagcrossmon,7,DP-2
bind=SUPER+SHIFT,code:17,tagcrossmon,8,DP-2
bind=SUPER+SHIFT,code:18,tagcrossmon,9,DP-2

# Applications
bind=SUPER,Return,spawn,wezterm
bind=SUPER,w,spawn,foot --app-id tui -e impala
bind=SUPER,b,spawn,foot --app-id tui -e bluetui
bind=SUPER,m,spawn,foot --app-id tui -e btop
bind=SUPER,g,toggle_named_scratchpad,(?i).*chatgpt.*,none,chatgpt
bind=SUPER,BackSpace,toggle_named_scratchpad,^foot-scratchpad$,none,foot --app-id foot-scratchpad

# QuickShell
bind=SUPER,a,spawn,quickshell ipc call shell audio
bind=SUPER,c,spawn,quickshell ipc call shell clock
bind=SUPER,e,spawn,quickshell ipc call shell emoji
bind=SUPER,p,spawn,quickshell ipc call shell battery
bind=SUPER,d,spawn,quickshell ipc call shell display
bind=SUPER,R,spawn,quickshell ipc call shell launcher
bind=SUPER,o,spawn,quickshell ipc call shell openRecent

# Scripts
bind=SUPER,i,spawn,swayidle-toogle
bind=SUPER,s,spawn,screenshot
bind=SUPER+SHIFT,s,spawn,screenshot --save
bind=SUPER,space,switch_keyboard_layout

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,quickshell ipc call shell brightnessUp
bind=NONE,XF86MonBrightnessDown,spawn,quickshell ipc call shell brightnessDown

# Audio
bind=NONE,XF86AudioRaiseVolume,spawn,quickshell ipc call shell volumeUp
bind=NONE,XF86AudioLowerVolume,spawn,quickshell ipc call shell volumeDown
bind=NONE,XF86AudioMute,spawn,quickshell ipc call shell volumeMute

# Mango
bind=SUPER+SHIFT,r,reload_config

# Window management
bind=SUPER,q,killclient
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

bind=SUPER+CTRL,h,resizewin,-10,0
bind=SUPER+CTRL,l,resizewin,+10,0
bind=SUPER+CTRL,k,resizewin,0,-10
bind=SUPER+CTRL,j,resizewin,0,+10

switchbind=fold,spawn_shell,swaylock -f && systemctl suspend
