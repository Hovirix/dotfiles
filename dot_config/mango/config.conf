# ------------------------------------------------
# Configuration
# ------------------------------------------------

env=WLR_RENDERER,vulkan

# Autostart
exec-once=swaybg -i ~/Pictures/Wallpapers/nixos-mocha.png -m fill
exec-once=wlsunset -t 3000 -T 6500 -s 20:00 -S 07:00
exec-once=swayidle -w
exec-once=chatgpt
exec-once=chromium
exec-once=appflowy

# Monitors
monitorrule=name:^eDP-1$,width:2880,height:1800,refresh:120,x:2048,y:0,scale:1.5
monitorrule=name:^HDMI-A-1$,width:2560,height:1440,refresh:144,x:0,y:0,scale:1.25

# Inputs Devices
xkb_rules_layout=us,us
xkb_rules_variant=,intl
xkb_rules_options=ctrl:nocaps

mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0

tap_to_click=1
trackpad_disable_while_typing=1
trackpad_natural_scrolling=1
trackpad_accel_profile=1
trackpad_accel_speed=1.0

# Misc
no_border_when_single=1

# ------------------------------------------------
# Visuals
# ------------------------------------------------

# Theming
borderpx=2
gappih=0
gappiv=0
gappoh=0
gappov=0
cursor_size=24
cursor_theme=Bibata-Modern-Amber

#Colors
rootcolor=0x1e1e2eff
bordercolor=0x6c7086ff
focuscolor=0xfab387ff
urgentcolor=0xf38ba8ff
scratchpadcolor=0xb4befeff

# Effects
blur=0
shadows=0

# Animations

# ------------------------------------------------
# Window Management
# ------------------------------------------------

# Layouts
new_is_master=0
default_mfact=0.50

# Rules
windowrule=tags:1,monitor:eDP-1,isopensilent:1,appid:(?i).*chromium.*
windowrule=tags:2,monitor:eDP-1,appid:(?i).*virt-manager.*
windowrule=tags:2,monitor:eDP-1,appid:(?i).*qemu.*
windowrule=tags:3,monitor:eDP-1,appid:(?i).*wezterm.*
windowrule=tags:4,monitor:eDP-1,isopensilent:1,appid:(?i).*appflowy.*
windowrule=tags:5,monitor:eDP-1,appid:(?i).*freetube.*

windowrule=isfloating:1,width:0.6,height:0.6,appid:^impala$
windowrule=isfloating:1,width:0.6,height:0.6,appid:^bluetui$
windowrule=isfloating:1,width:0.5,height:0.5,title:(?i).*bitwarden.*
windowrule=isfloating:1,width:0.6,height:0.6,title:(?i).*localsend.*

windowrule=isnamedscratchpad:1,width:0.95,height:0.95,appid:(?i).*chatgpt.*

# Tags
tagrule=id:*,layout_name:master

tagrule=id:1,monitor_name:eDP-1
tagrule=id:2,monitor_name:eDP-1
tagrule=id:3,monitor_name:eDP-1
tagrule=id:4,monitor_name:eDP-1
tagrule=id:5,monitor_name:eDP-1

tagrule=id:6,monitor_name:HDMI-A-1
tagrule=id:7,monitor_name:HDMI-A-1
tagrule=id:8,monitor_name:HDMI-A-1
tagrule=id:9,monitor_name:HDMI-A-1
tagrule=id:10,monitor_name:HDMI-A-1

# ------------------------------------------------
# Bindings & Input
# ------------------------------------------------

# Tags
bind=SUPER,code:9,toggle_scratchpad
bind=SUPER,code:10,viewcrossmon,1,eDP-1
bind=SUPER,code:11,viewcrossmon,2,eDP-1
bind=SUPER,code:12,viewcrossmon,3,eDP-1
bind=SUPER,code:13,viewcrossmon,4,eDP-1
bind=SUPER,code:14,viewcrossmon,5,eDP-1
bind=SUPER,code:15,viewcrossmon,6,HDMI-A-1
bind=SUPER,code:16,viewcrossmon,7,HDMI-A-1
bind=SUPER,code:17,viewcrossmon,8,HDMI-A-1
bind=SUPER,code:18,viewcrossmon,9,HDMI-A-1

# Move the focused window to a tag
bind=SUPER+SHIFT,code:9,minimized
bind=SUPER+SHIFT,code:10,tagcrossmon,1,eDP-1
bind=SUPER+SHIFT,code:11,tagcrossmon,2,eDP-1
bind=SUPER+SHIFT,code:12,tagcrossmon,3,eDP-1
bind=SUPER+SHIFT,code:13,tagcrossmon,4,eDP-1
bind=SUPER+SHIFT,code:14,tagcrossmon,5,eDP-1
bind=SUPER+SHIFT,code:15,tagcrossmon,6,HDMI-A-1
bind=SUPER+SHIFT,code:16,tagcrossmon,7,HDMI-A-1
bind=SUPER+SHIFT,code:17,tagcrossmon,8,HDMI-A-1
bind=SUPER+SHIFT,code:18,tagcrossmon,9,HDMI-A-1

# Applications
bind=SUPER,R,spawn,fuzzel
bind=SUPER,Return,spawn,wezterm
bind=SUPER,w,spawn,foot --app-id impala  -e impala
bind=SUPER,b,spawn,foot --app-id bluetui -e bluetui
bind=SUPER,m,spawn,foot --app-id btop --window-size-pixels 1440x900 -e btop
bind=SUPER,g,toggle_named_scratchpad,(?i).*chatgpt.*,none,chatgpt

# Scripts
bind=SUPER,c,spawn,swayidle-toogle
bind=SUPER,e,spawn,fz-emoji
bind=SUPER,a,spawn,fz-audio
bind=SUPER,d,spawn,fz-display
bind=SUPER,o,spawn,fz-open
bind=SUPER,s,spawn,fz-screenshot
bind=SUPER,space,switch_keyboard_layout

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightness-osd up
bind=NONE,XF86MonBrightnessDown,spawn,brightness-osd down

# Audio
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

# Mango
bind=SUPER+SHIFT,r,reload_config

# Window management
bind=SUPER,q,killclient
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

bind=SUPER+CTRL,h,resizewin,-10,0
bind=SUPER+CTRL,l,resizewin,+10,0
bind=SUPER+CTRL,k,resizewin,0,-10
bind=SUPER+CTRL,j,resizewin,0,+10

switchbind=fold,spawn_shell,swaylock -f && systemctl suspend
