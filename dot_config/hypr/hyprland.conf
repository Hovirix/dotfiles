# ===================================================================
# Variables
# https://wiki.hypr.land/0.54.0/Configuring/Variables/
# ===================================================================

$mod = SUPER

$base = rgb(24273a)
$baseAlpha = 24273a
$blue = rgb(8aadf4)
$blueAlpha = 8aadf4
$crust = rgb(181926)
$crustAlpha = 181926
$flamingo = rgb(f0c6c6)
$flamingoAlpha = f0c6c6
$green = rgb(a6da95)
$greenAlpha = a6da95
$lavender = rgb(b7bdf8)
$lavenderAlpha = b7bdf8
$mantle = rgb(1e2030)
$mantleAlpha = 1e2030
$maroon = rgb(ee99a0)
$maroonAlpha = ee99a0
$mauve = rgb(c6a0f6)
$mauveAlpha = c6a0f6
$overlay0 = rgb(6e738d)
$overlay0Alpha = 6e738d
$overlay1 = rgb(8087a2)
$overlay1Alpha = 8087a2
$overlay2 = rgb(939ab7)
$overlay2Alpha = 939ab7
$peach = rgb(f5a97f)
$peachAlpha = f5a97f
$pink = rgb(f5bde6)
$pinkAlpha = f5bde6
$red = rgb(ed8796)
$redAlpha = ed8796
$rosewater = rgb(f4dbd6)
$rosewaterAlpha = f4dbd6
$sapphire = rgb(7dc4e4)
$sapphireAlpha = 7dc4e4
$sky = rgb(91d7e3)
$skyAlpha = 91d7e3
$subtext0 = rgb(a5adcb)
$subtext0Alpha = a5adcb
$subtext1 = rgb(b8c0e0)
$subtext1Alpha = b8c0e0
$surface0 = rgb(363a4f)
$surface0Alpha = 363a4f
$surface1 = rgb(494d64)
$surface1Alpha = 494d64
$surface2 = rgb(5b6078)
$surface2Alpha = 5b6078
$teal = rgb(8bd5ca)
$tealAlpha = 8bd5ca
$text = rgb(cad3f5)
$textAlpha = cad3f5
$yellow = rgb(eed49f)
$yellowAlpha = eed49f

# ===================================================================
# Environment Variables
# https://wiki.hypr.land/0.54.0/Configuring/Environment-variables/
# ===================================================================

env = XCURSOR_THEME,Bibata-Modern-Amber
env = XCURSOR_SIZE,24

# ===================================================================
# Keywords / Autostart
# https://wiki.hypr.land/0.54.0/Configuring/Keywords/
# ===================================================================

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_DATA_DIRS
exec-once = hyprctl setcursor Bibata-Modern-Amber 24
exec-once = hypridle
exec-once = hyprpaper
exec-once = hyprsunset
exec-once = waybar

# ===================================================================
# Monitors
# https://wiki.hypr.land/0.54.0/Configuring/Monitors/
# ===================================================================

monitor = eDP-1, 2880x1800@120, auto, 1.5, bitdepth, 10
monitor = HDMI-A-1, 2560x1440@144, auto-left, 1.25

# ===================================================================
# General / Decoration / Input / Misc Variables
# https://wiki.hypr.land/0.54.0/Configuring/Variables/
# ===================================================================

general {
    border_size = 2
    col.active_border = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.inactive_border = rgba(b4befecc) rgba(6c7086cc) 45deg
    gaps_in = 0
    gaps_out = 0
    layout = master
}

decoration {
    # active_opacity = 0.8
    # inactive_opacity = 0.8
    rounding = 0

    blur {
        enabled = true
        size = 6
        passes = 3
    }

    shadow {
        enabled = false
    }
}

# animations {
#     enabled = false
# }

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

input {
    accel_profile = flat
    kb_layout = us
    # kb_variant = intl
    kb_options = ctrl:nocaps
    sensitivity = 0.4

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        tap-to-click = true
    }
}

group {
    groupbar {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    force_default_wallpaper = 0
}

binds {
    disable_keybind_grabbing = true
}

xwayland {
    enabled = false
}

ecosystem {
    enforce_permissions = false
    no_donation_nag = true
}

# ===================================================================
# Binds
# https://wiki.hypr.land/0.54.0/Configuring/Binds/
# ===================================================================

# Apps
bind = $mod, RETURN, exec, wezterm-gui
bind = CTRL, 1, exec, flatpak run io.gitlab.librewolf-community
bind = CTRL, 2, exec, virt-manager
bind = CTRL, 4, exec, flatpak run md.obsidian.Obsidian
bind = CTRL, 5, exec, flatpak run io.freetubeapp.FreeTube

# Audio
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1

# Brightness
bind = , XF86MonBrightnessDown, exec, brightness-osd down
bind = , XF86MonBrightnessUp, exec, brightness-osd up

# Focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Hyprland
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, R, exec, hyprctl reload

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bindm = $mod, mouse:272, movewindow

# Resize
bind = $mod CTRL, H, resizeactive, -10 0
bind = $mod CTRL, J, resizeactive, 0 10
bind = $mod CTRL, K, resizeactive, 0 -10
bind = $mod CTRL, L, resizeactive, 10 0
bindm = $mod, mouse:273, resizewindow

# Screenshots
bind = $mod, S, exec, grimlite --notify copy anything
bind = $mod CTRL, S, exec, grimlite --notify save anything
bind = $mod CTRL ALT, S, exec, grimlite --notify save screen

# Scripts
bind = $mod, C, exec, toggle-hypridle
bind = $mod, W, exec, toggle-tailscale

# System
bind = $mod SHIFT CTRL, P, exec, poweroff
bind = $mod SHIFT CTRL, R, exec, reboot
bind = $mod SHIFT CTRL, S, exec, loginctl suspend

# Window management
bind = $mod, F, fullscreen
bind = $mod, Q, killactive
bind = $mod, T, togglefloating

# Workspaces / scratchpad
bind = $mod, code:9, togglespecialworkspace
bind = $mod, code:10, workspace, 1
bind = $mod, code:11, workspace, 2
bind = $mod, code:12, workspace, 3
bind = $mod, code:13, workspace, 4
bind = $mod, code:14, workspace, 5
bind = $mod, code:15, workspace, 6
bind = $mod, code:16, workspace, 7
bind = $mod, code:17, workspace, 8
bind = $mod, code:18, workspace, 9
bind = $mod, code:19, workspace, 10

bind = $mod SHIFT, code:9, movetoworkspace, special
bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod SHIFT, code:18, movetoworkspace, 9
bind = $mod SHIFT, code:19, movetoworkspace, 10

# ===================================================================
# Window Rules
# https://wiki.hypr.land/0.54.0/Configuring/Window-Rules/
# ===================================================================

windowrule = match:class ^(?i)(FreeTube)$, workspace 5
windowrule = match:class ^(?i)(wezterm)$, workspace 3
windowrule = match:class ^(?i)(librewolf)$, workspace 1
windowrule = match:class ^(?i)(obsidian)$, workspace 4

windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]s[false]

# ===================================================================
# Workspace Rules
# https://wiki.hypr.land/0.54.0/Configuring/Workspace-Rules/
# ===================================================================

workspace = w[tv1]s[false], gapsout:0, gapsin:0

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1, layout:scrolling
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
