# ----------------------------------------------------
# Theme
# ----------------------------------------------------

theme = "catppuccin_mocha"

# ----------------------------------------------------
# Editor
# ----------------------------------------------------

[editor]
continue-comments = false
completion-replace = true
true-color = true
bufferline = "multiple"
color-modes = true
end-of-line-diagnostics = "hint"


[editor.statusline]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
left = ["mode", "spinner"]
center = ["file-name"]
right = ["diagnostics", "version-control"]
diagnostics = ["warning", "error", "info"]

[editor.lsp]
display-progress-messages = true
display-inlay-hints = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true
max-wrap = 25
wrap-indicator = "↪ "
wrap-at-text-width = false

[editor.inline-diagnostics]
other-lines = "info"
cursor-line = "warning"

# ----------------------------------------------------
# Keybidings
# ----------------------------------------------------

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
C-y = [
  ':sh rm -f "${XDG_RUNTIME_DIR:?}/helix-yazi-$PPID"',
  ':insert-output yazi --chooser-file="${XDG_RUNTIME_DIR:?}/helix-yazi-$PPID"',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat "${XDG_RUNTIME_DIR:?}/helix-yazi-$PPID" && rm -f "${XDG_RUNTIME_DIR:?}/helix-yazi-$PPID"}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
