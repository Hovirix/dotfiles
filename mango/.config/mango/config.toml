# -------------------------------------------------------------------
# Environment Variables
# -------------------------------------------------------------------

[env]
WLR_RENDERER = "vulkan"

# -------------------------------------------------------------------
# Basic Configuration
# -------------------------------------------------------------------

[global]

# Autostart
exec_once = [
  "swaybg -i ~/Pictures/Wallpapers/nixos-mocha.png -m fill",
  "wlsunset -t 3000 -T 6500 -s 18:00 -S 07:00",
  "swayidle -w",
  "dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE",
  "quickshell --daemonize --no-duplicate",
  "chatgpt",
  "chromium",
  "chromium --app=https://app.notion.com",
]

# -------------------------------------------------------------------
# Input Devices
# -------------------------------------------------------------------

# Keyboard Settings
xkb_rules_layout = "us,us"
xkb_rules_variant = ",intl"
xkb_rules_options = "ctrl:nocaps"

# Mouse Settings
mouse_natural_scrolling = 0
mouse_accel_profile = 1
mouse_accel_speed = 0.0

# Trackpad Settings
tap_to_click = 1
trackpad_disable_while_typing = 1
trackpad_natural_scrolling = 1
trackpad_accel_profile = 1
trackpad_accel_speed = 1.0

# -------------------------------------------------------------------
# Miscellaneous
# -------------------------------------------------------------------

# System & Hardware
xwayland_persistence = 0
# allow_shortcuts_inhibit = 0

# Multi-Monitor & Tags
focus_cross_monitor = 1
scratchpad_cross_monitor = 1
tag_num = 6

# Window Behavior
no_border_when_single = 1
idle_inhibit_ignore_visible = 1
idle_inhibit_when_fullscreen = 1

# -------------------------------------------------------------------
# Visuals
# -------------------------------------------------------------------

# Borders & Gaps
border_px = 2
gap_inner_horizontal = 0
gap_inner_vertical = 0
gap_outer_horizontal = 0
gap_outer_vertical = 0

# Cursor
cursor_size = 24
cursor_theme = "Bibata-Modern-Amber"

# Colors
root_color = 0x1e1e2eff
border_color = 0x6c7086ff
focus_color = 0xfab387ff
urgent_color = 0xf38ba8ff
scratchpad_color = 0xb4befeff

# Effects
blur = 0
shadows = 0
animations = 0

# -------------------------------------------------------------------
# Layouts
# -------------------------------------------------------------------

# Master-Stack Layouts
new_is_master = 0
default_master_factor = 0.50

# -------------------------------------------------------------------
# Monitors
# -------------------------------------------------------------------

[var]
primary_monitor = "DP-2"

# Monitor Rules
[[rule.monitor_rule]]
name = "^eDP-1$"
width = 2880
height = 1800
refresh = 120
x = 0
y = 0
scale = 1.5
vrr = 1
icc = "~/.config/mango/LAPTOP.icc"

[[rule.monitor_rule]]
name = "^DP-2$"
width = 1920
height = 1080
refresh = 144
x = 1920
y = 0
scale = 1
vrr = 1

# -------------------------------------------------------------------
# Rules
# -------------------------------------------------------------------

# Window Rules
[[rule.window_rule]]
tags = 1
monitor = "$primary_monitor"
is_open_silent = 1
app_id = "(?i).*chromium.*"

[[rule.window_rule]]
tags = 2
monitor = "$primary_monitor"
app_id = "(?i).*thunderbird.*"

[[rule.window_rule]]
tags = 3
monitor = "$primary_monitor"
app_id = "(?i).*wezterm.*"

[[rule.window_rule]]
tags = 4
monitor = "$primary_monitor"
is_open_silent = 1
app_id = "(?i).*notion.*"

[[rule.window_rule]]
tags = 5
monitor = "$primary_monitor"
app_id = "(?i).*freetube.*"

[[rule.window_rule]]
tags = 6
monitor = "$primary_monitor"
app_id = "(?i).*virt-manager.*"

[[rule.window_rule]]
tags = 6
monitor = "$primary_monitor"
app_id = "(?i).*qemu.*"

# Floating Windows
[[rule.window_rule]]
is_floating = 1
width = 0.7
height = 0.7
app_id = "^tui$"

[[rule.window_rule]]
is_floating = 1
width = 0.5
height = 0.5
title = "(?i).*localsend.*"

# Named Scratchpad
[[rule.window_rule]]
is_named_scratchpad = 1
width = 0.6
height = 0.6
app_id = "^foot-scratchpad$"

[[rule.window_rule]]
is_named_scratchpad = 1
is_open_silent = 1
width = 0.95
height = 0.95
app_id = "(?i).*chatgpt.*"

[[rule.window_rule]]
is_named_scratchpad = 1
is_open_silent = 1
width = 0.95
height = 0.95
app_id = "(?i).*openclaw.*"

# Tag Rules
[[rule.tag_rule]]
id = "*"
layout_name = "tile"

# -------------------------------------------------------------------
# Key Bindings
# -------------------------------------------------------------------

[bind.default]

# Tags & Monitors
"SUPER+code:9" = "toggle_scratchpad"
"SUPER+SHIFT+code:9" = "minimized"
"SUPER+code:10" = "view,1,0"
"SUPER+code:11" = "view,2,0"
"SUPER+code:12" = "view,3,0"
"SUPER+code:13" = "view,4,0"
"SUPER+code:14" = "view,5,0"
"SUPER+code:15" = "view,6,0"

# Move the focused window to a tag
"SUPER+SHIFT+code:10" = "tag,1,0"
"SUPER+SHIFT+code:11" = "tag,2,0"
"SUPER+SHIFT+code:12" = "tag,3,0"
"SUPER+SHIFT+code:13" = "tag,4,0"
"SUPER+SHIFT+code:14" = "tag,5,0"
"SUPER+SHIFT+code:15" = "tag,6,0"

# Monitors
"SUPER+ALT+h" = "focusmon,left"
"SUPER+ALT+l" = "focusmon,right"
"SUPER+ALT+SHIFT+h" = "tagmon,left,1"
"SUPER+ALT+SHIFT+l" = "tagmon,right,1"

# Applications
"SUPER+Return" = "spawn,wezterm"
"SUPER+w" = "spawn,foot --app-id tui -e impala"
"SUPER+m" = "spawn,foot --app-id tui -e btop"
"SUPER+g" = "toggle_named_scratchpad,(?i).*chatgpt.*,none,chatgpt"
"SUPER+o" = "toggle_named_scratchpad,(?i).*openclaw.*,none,chromium --app=https://openclaw.hovirix.dev"
"SUPER+BackSpace" = "toggle_named_scratchpad,^foot-scratchpad$,none,foot --app-id foot-scratchpad"

# Quickshell
"SUPER+space" = "spawn,quickshell ipc call shell menu"
"SUPER+n" = "spawn,quickshell ipc call shell activateNotification"

# Triggers
"SUPER+b" = "spawn,quickshell ipc call shell battery"
"SUPER+c" = "spawn,hx-date"

# Scripts
"SUPER+i" = "spawn,hx-idle-toggle"
"SUPER+s" = "spawn,hx-screenshot"
"SUPER+SHIFT+s" = "spawn,hx-screenshot --save"

# Brightness
"XF86MonBrightnessUp" = "spawn,quickshell ipc call shell brightnessUp"
"XF86MonBrightnessDown" = "spawn,quickshell ipc call shell brightnessDown"

# Audio
"XF86AudioRaiseVolume" = "spawn,quickshell ipc call shell volumeUp"
"XF86AudioLowerVolume" = "spawn,quickshell ipc call shell volumeDown"
"XF86AudioMute" = "spawn,quickshell ipc call shell volumeMute"

# Mango
"SUPER+SHIFT+r" = "spawn,sh -c 'mmsg dispatch reload_config && notify-send -a Mango -i view-refresh \"Mango\" \"Configuration reloaded\"'"

# Window Management
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focusdir,up"
"SUPER+j" = "focusdir,down"
"SUPER+q" = "killclient"
"SUPER+t" = "togglefloating"
"SUPER+f" = "togglefullscreen"
"SUPER+SHIFT+f" = "togglefakefullscreen"
"SUPER+SHIFT+h" = "exchange_client,left"
"SUPER+SHIFT+l" = "exchange_client,right"
"SUPER+SHIFT+k" = "exchange_client,up"
"SUPER+SHIFT+j" = "exchange_client,down"
"SUPER+CTRL+h" = "resizewin,-10,0"
"SUPER+CTRL+l" = "resizewin,+10,0"
"SUPER+CTRL+k" = "resizewin,0,-10"
"SUPER+CTRL+j" = "resizewin,0,+10"

# -------------------------------------------------------------------
# Mouse & Gestures
# -------------------------------------------------------------------

# Mouse Bindings
[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"

# Switch Bindings
[switchbind.default]
fold = "spawn,hx-suspend"
