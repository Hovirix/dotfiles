[mgr]
cwd = { fg = "#f38ba8" }

# Find
find_keyword  = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#f5c2e7", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#f38ba8", bg = "#f38ba8" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }

# Border
border_symbol = "│"
border_style  = { fg = "#7f849c" }

[tabs]
active   = { fg = "#1e1e2e", bg = "#fab387", bold = true }
inactive = { fg = "#fab387", bg = "#313244" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#fab387", bold = true }
normal_alt  = { fg = "#fab387", bg = "#313244" }

# Select mode
select_main = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
select_alt  = { fg = "#f38ba8", bg = "#313244" }

# Unset mode
unset_main = { fg = "#1e1e2e", bg = "#f2cdcd", bold = true }
unset_alt  = { fg = "#f2cdcd", bg = "#313244" }

[status]
# Permissions
perm_sep   = { fg = "#7f849c" }
perm_type  = { fg = "#fab387" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#a6e3a1", bg = "#45475a" }
progress_error  = { fg = "#f9e2af", bg = "#f38ba8" }

[pick]
border   = { fg = "#fab387" }
active   = { fg = "#f5c2e7", bold = true }
inactive = {}

[input]
border   = { fg = "#fab387" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "#fab387" }

[tasks]
border  = { fg = "#fab387" }
title   = {}
hovered = { fg = "#f5c2e7", bold = true }

[which]
mask            = { bg = "#313244" }
cand            = { fg = "#f38ba8" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#f38ba8" }
run     = { fg = "#f5c2e7" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#313244", bg = "#1e1e2e" }

[spot]
border   = { fg = "#fab387" }
title    = { fg = "#fab387" }
tbl_col  = { fg = "#f38ba8" }
tbl_cell = { fg = "#f5c2e7", bg = "#45475a" }

[notify]
title_info  = { fg = "#a6e3a1" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[filetype]
rules = [
    # Image
    { mime = "image/*", fg = "#f38ba8" },
    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },
    # Archive
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },
    # Document
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },
    # Virtual file system
    { mime = "vfs/{absent,stale}", fg = "#9399b2" },
    # Fallback
    { url = "*", fg = "#cdd6f4" },
    { url = "*/", fg = "#fab387" },
]

[icon]
dirs = [
    { name = ".config", text = "", fg = "#f5c2e7" },
    { name = ".git", text = "", fg = "#f38ba8" },
    { name = ".github", text = "", fg = "#fab387" },
    { name = ".npm", text = "", fg = "#fab387" },
    { name = "Desktop", text = "", fg = "#f38ba8" },
    { name = "Development", text = "", fg = "#f38ba8" },
    { name = "Documents", text = "", fg = "#f38ba8" },
    { name = "Downloads", text = "", fg = "#f38ba8" },
    { name = "Library", text = "", fg = "#f38ba8" },
    { name = "Movies", text = "", fg = "#f38ba8" },
    { name = "Music", text = "", fg = "#f38ba8" },
    { name = "Pictures", text = "", fg = "#f38ba8" },
    { name = "Public", text = "", fg = "#f38ba8" },
    { name = "Videos", text = "", fg = "#f38ba8" },
]
conds = [
    # Special files
    { if = "orphan", text = "", fg = "#cdd6f4" },
    { if = "link", text = "", fg = "#7f849c" },
    { if = "block", text = "", fg = "#f2cdcd" },
    { if = "char", text = "", fg = "#f2cdcd" },
    { if = "fifo", text = "", fg = "#f2cdcd" },
    { if = "sock", text = "", fg = "#f2cdcd" },
    { if = "sticky", text = "", fg = "#f2cdcd" },
    { if = "dummy", text = "", fg = "#f38ba8" },

    # Fallback
    { if = "dir & hovered", text = "", fg = "#fab387" },
    { if = "dir", text = "", fg = "#fab387" },
    { if = "exec", text = "", fg = "#a6e3a1" },
    { if = "!dir", text = "", fg = "#cdd6f4" },
]
